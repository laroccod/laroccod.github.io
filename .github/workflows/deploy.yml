name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The hero "commits on GitHub" stat is baked in at build time, so a weekly
  # rebuild keeps it current without needing a push.
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # src/data/github.ts counts commits via the GitHub API during the build.
      # The automatic Actions token lifts the 60 req/hr unauthenticated limit
      # that shared runner IPs would otherwise blow through; without it the
      # stat silently falls back to its last known value.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # next.config.ts sets output: "export", so the site lands in out/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
